server.address=${TRADE_API_BIND:127.0.0.1}
server.port=${TRADE_API_PORT:8080}
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USER}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=3000
spring.flyway.enabled=${TRADE_MIGRATE:false}
spring.flyway.default-schema=trade_api_migrations
spring.flyway.schemas=trade_api_migrations
spring.flyway.create-schemas=true
spring.jackson.deserialization.use-big-decimal-for-floats=true
server.error.include-message=never
server.shutdown=graceful
spring.jackson.deserialization.fail-on-unknown-properties=true
